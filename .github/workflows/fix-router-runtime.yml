name: Fix GPT-OSS router runtime compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-router-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace structured-output router with plain JSON router
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/streamlit_app.py')
          text = p.read_text(encoding='utf-8')

          old = '''def structured_router():
    # Groq supports strict structured output for openai/gpt-oss-20b.
    return model(max_tokens=600).with_structured_output(
        RouterDecision,
        method="function_calling",
    )
'''

          new = '''def extract_router_json(raw):
    text = str(raw or '').strip()
    if not text:
        return None
    try:
        value = json.loads(text)
        return value if isinstance(value, dict) else None
    except json.JSONDecodeError:
        pass

    for block in re.findall(r"```(?:json)?\\s*(.*?)\\s*```", text, re.I | re.S):
        try:
            value = json.loads(block.strip())
            if isinstance(value, dict):
                return value
        except json.JSONDecodeError:
            continue

    decoder = json.JSONDecoder()
    for i, ch in enumerate(text):
        if ch != "{":
            continue
        try:
            value, _ = decoder.raw_decode(text[i:])
            if isinstance(value, dict):
                return value
        except json.JSONDecodeError:
            continue
    return None
'''

          if old not in text:
              raise SystemExit('structured_router block not found')
          text = text.replace(old, new, 1)

          old_route = '''async def route_request():
    try:
        router = structured_router()
        return await router.ainvoke([HumanMessage(content=SYSTEM_PROMPT)])
    except Exception as first_error:
        # One retry with the same strict schema. We fail only after both calls,
        # and expose the real error instead of pretending information is missing.
        try:
            retry_prompt = SYSTEM_PROMPT + "\\n\\nReturn the RouterDecision now. Do not answer the trip itself."
            return await structured_router().ainvoke([HumanMessage(content=retry_prompt)])
        except Exception as second_error:
            raise RuntimeError(
                f"Semantic router failed twice: {type(second_error).__name__}: {second_error}"
            ) from second_error
'''

          new_route = '''async def route_request():
    schema = {
        "action": "FETCH | REUSE | ASK",
        "missing": "string or null",
        "question": "string or null",
        "origin": "plain city name or null",
        "destinations": [{"city": "plain city name", "country": "string or null"}],
        "departDate": "YYYY-MM-DD or null",
        "returnDate": "YYYY-MM-DD or null",
        "passengers": "integer or null",
        "budgetLevel": "budget | mid-range | luxury | null",
        "replace_active": "boolean",
        "compare_with_active": "boolean"
    }
    prompt = SYSTEM_PROMPT + "\\n\\nROUTER OUTPUT CONTRACT\\nReturn ONLY one valid JSON object. Do NOT call tools. Do NOT use markdown. Do NOT write a travel answer.\\nSchema:\\n" + json.dumps(schema, indent=2)

    last_error = None
    for attempt in range(2):
        try:
            result = await model(max_tokens=600).ainvoke([HumanMessage(content=prompt)])
            parsed = extract_router_json(result.content)
            if isinstance(parsed, dict) and parsed.get("action") in {"FETCH", "REUSE", "ASK"}:
                return RouterDecision(**parsed)
            last_error = ValueError("Router returned invalid or incomplete JSON")
        except Exception as exc:
            last_error = exc

        prompt += "\\n\\nRETRY: Output ONLY the JSON object matching the schema. No tool call, no prose."

    raise RuntimeError(
        f"Semantic router failed twice: {type(last_error).__name__}: {last_error}"
    )
'''

          if old_route not in text:
              raise SystemExit('route_request block not found')
          text = text.replace(old_route, new_route, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git commit -m "Use plain JSON completion for GPT-OSS router"
          git push