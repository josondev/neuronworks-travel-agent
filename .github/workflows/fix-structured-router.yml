name: Fix structured router compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-structured-router.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch router method
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/streamlit_app.py')
          text = p.read_text(encoding='utf-8')
          old = '''    return model(max_tokens=600).with_structured_output(\n        RouterDecision,\n        method="json_schema",\n        strict=True,\n    )'''
          new = '''    return model(max_tokens=600).with_structured_output(\n        RouterDecision,\n        method="function_calling",\n    )'''
          if old not in text:
              raise SystemExit('Expected structured router block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git commit -m "Use function calling for semantic router" || true
          git push
