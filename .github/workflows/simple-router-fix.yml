name: Simple router fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase router output limit
        run: sed -i 's/max_tokens=180/max_tokens=500/' frontend/streamlit_app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: increase fast router JSON output limit"
          git push origin main
