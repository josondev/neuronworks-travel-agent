name: Repair fast router

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[router-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          new_func = r'''def parse_route_output(raw):
    """Parse router output defensively; never fail a user because of formatting."""
    text = (raw or '').strip()
    candidates = []
    candidates.extend(re.findall(r"```(?:json)?\s*(.*?)\s*```", text, re.I | re.S))
    candidates.append(text)

    for candidate in candidates:
        candidate = candidate.strip()
        if not candidate:
            continue
        match = re.search(r"\{.*\}", candidate, re.S)
        if match:
            try:
                value = json.loads(match.group(0))
                if isinstance(value, dict) and value.get('action'):
                    return value
            except json.JSONDecodeError:
                pass

    # Accept the compact pipe format as a second protocol.
    line = text.splitlines()[0] if text else ''
    parts = [p.strip() for p in line.split('|')]
    if len(parts) >= 8:
        action, origin, city, airport, depart, ret, passengers, budget = parts[:8]
        return {
            'action': action.upper(),
            'origin': origin or None,
            'destinationCity': city or None,
            'destinationAirport': airport or None,
            'departDate': depart or None,
            'returnDate': ret or None,
            'passengers': int(passengers) if passengers.isdigit() else None,
            'budgetLevel': budget or None,
        }

    return {'action': 'ASK'}


async def route_with_fallback(message, context):
    route = local_route(message, context)
    if route:
        return route

    prompt = f"""{SYSTEM_REFERENCE}

Return ONE line only in this exact format:
ACTION|ORIGIN_IATA|DESTINATION_CITY|DESTINATION_IATA|DEPART_DATE|RETURN_DATE|PASSENGERS|BUDGET

Current context: {json.dumps((context or {}).get('request', {}), ensure_ascii=False)}
User message: {message}

Allowed ACTION values: PLAN, UPDATE, COMPARE, BATCH_UPDATE, REUSE, ASK.
For 'do the same for A, B and C', return BATCH_UPDATE and put A, B, C in DESTINATION_CITY separated by commas.
Preserve origin, dates, travelers and budget from earlier context on follow-ups.
Dates must be YYYY-MM-DD or empty.
Airport fields must always be official uppercase 3-letter IATA codes or empty. Never return a city name in an airport field.
"""
    try:
        result = await model().ainvoke([HumanMessage(content=prompt)])
        return parse_route_output(result.content)
    except Exception:
        return {'action': 'ASK'}
'''

          pattern = re.compile(r"async def route_with_fallback\(message, context\):.*?\n\ndef normalize\(", re.S)
          replacement = new_func + "\n\ndef normalize("
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not find route_with_fallback block')

          path.write_text(patched, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git rm .github/workflows/repair-fast-router.yml
          git commit -m "fix: make fast router formatting tolerant [router-repair]"
          git push
