name: Fix fast router parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-router:
    if: "!contains(github.event.head_commit.message, '[router-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch deterministic router
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('frontend/streamlit_app.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def local_route(')
          end = text.index('\ndef normalize(', start)

          replacement = r'''def local_route(message, context):
    text = message.strip().lower()
    base = (context or {}).get("request", {}).copy()

    # Fast deterministic follow-ups first.
    if re.search(r"\bcheapest\s+(?:hotel|flight)\b", text):
        return {"action": "REUSE"}

    compare = re.search(r"\bcompare\b.*\b(?:with|vs|versus|to)\s+([a-zA-Z][\w\s-]+?)(?:\?|\.|$)", text)
    if compare:
        d = compare.group(1).strip().title()
        return {
            "action": "COMPARE",
            "destinationCity": d,
            "destinationCountry": COUNTRY.get(d.lower()),
            "destinationAirport": IATA.get(d.lower()),
        }

    change = re.search(r"\b(?:change|switch|move)\s+(?:the\s+)?destination\s+(?:to|into)\s+([a-zA-Z][\w\s-]+?)(?:\?|\.|$)", text)
    if change:
        d = change.group(1).strip().title()
        return {
            "action": "UPDATE",
            "destinationCity": d,
            "destinationCountry": COUNTRY.get(d.lower()),
            "destinationAirport": IATA.get(d.lower()),
        }

    # Parse "from Chennai to Madurai" deterministically so common requests
    # never need the slower LLM router.
    route_match = re.search(
        r"\bfrom\s+([a-zA-Z][a-zA-Z .'-]*?)\s+to\s+([a-zA-Z][a-zA-Z .'-]*?)"
        r"(?=\s+(?:from|for|on|between|with)\b|\s*$)",
        text,
    )
    if route_match:
        origin = route_match.group(1).strip().title()
        destination = route_match.group(2).strip().title()
        base["origin"] = IATA.get(origin.lower(), origin)
        base["destinationCity"] = destination
        base["destinationAirport"] = IATA.get(destination.lower(), "")
        base["destinationCountry"] = COUNTRY.get(destination.lower(), base.get("destinationCountry", "India"))

    # Parse natural-language dates such as "August 20, 2026 to August 25, 2026".
    month_names = (
        "january|february|march|april|may|june|july|august|september|"
        "october|november|december"
    )
    month_date_pattern = rf"\b(?:{month_names})\s+\d{{1,2}},?\s+\d{{4}}\b"
    month_dates = re.findall(month_date_pattern, text, flags=re.I)
    if len(month_dates) >= 2:
        parsed = []
        for raw in month_dates[:2]:
            value = None
            for fmt in ("%B %d, %Y", "%B %d %Y"):
                try:
                    value = datetime.strptime(raw.replace(',', ''), "%B %d %Y").date()
                    break
                except ValueError:
                    pass
            if value:
                parsed.append(value.isoformat())
        if len(parsed) == 2:
            base["departDate"], base["returnDate"] = parsed

    # Also accept ISO dates.
    iso_dates = re.findall(r"\b20\d{2}-\d{2}-\d{2}\b", text)
    if len(iso_dates) >= 2:
        base["departDate"], base["returnDate"] = iso_dates[:2]

    traveler_match = re.search(r"\b(\d+)\s*(?:traveler|travellers|people|persons|adults?)\b", text)
    if traveler_match:
        base["passengers"] = int(traveler_match.group(1))
    elif re.search(r"\bfor\s+1\s+(?:traveler|person|adult)\b", text):
        base["passengers"] = 1

    if "budget" in text or "cheap" in text or "minimum" in text:
        base["budgetLevel"] = "budget"
    elif "luxury" in text or "luxurious" in text:
        base["budgetLevel"] = "luxury"
    elif "mid-range" in text or "moderate" in text:
        base["budgetLevel"] = "mid-range"

    # "to Madurai" / "for Madurai" fallback for common named destinations.
    dest_phrase = re.search(
        r"\b(?:to|for)\s+(?:the\s+)?(?:city\s+of\s+)?(madurai|coimbatore|colombo|chennai)\b",
        text,
    )
    if dest_phrase and not base.get("destinationCity"):
        d = dest_phrase.group(1).title()
        base.update({
            "destinationCity": d,
            "destinationCountry": COUNTRY.get(d.lower()),
            "destinationAirport": IATA.get(d.lower()),
        })

    if base.get("destinationCity") and base.get("origin") and base.get("departDate") and base.get("returnDate"):
        return {"action": "PLAN", **base}

    # Fall back to the LLM only when deterministic parsing cannot resolve
    # the turn (e.g. unfamiliar international cities).
    return None
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit parser fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "fix deterministic travel request parsing [router-fix]"
          git push
