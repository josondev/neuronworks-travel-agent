name: Fix travel router JSON parsing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'return ChatGroq(model="openai/gpt-oss-20b", temperature=0, max_tokens=180)',
              'return ChatGroq(model="openai/gpt-oss-20b", temperature=0, max_tokens=500)'
          )

          start = text.index('async def route_with_fallback(message, context):')
          end = text.index('\ndef normalize(req, base=None):', start)

          replacement = r'''def parse_json_object(raw: str):
              """Extract the first valid JSON object from an LLM response.

              Handles markdown fences, surrounding prose, and minor leading/trailing
              whitespace. Returns None when no valid JSON object can be recovered.
              """
              if not raw:
                  return None

              cleaned = raw.strip()
              cleaned = re.sub(r"^```(?:json)?\\s*", "", cleaned, flags=re.I)
              cleaned = re.sub(r"\\s*```$", "", cleaned)

              decoder = json.JSONDecoder()
              for match in re.finditer(r"\\{", cleaned):
                  try:
                      value, _ = decoder.raw_decode(cleaned[match.start():])
                      if isinstance(value, dict):
                          return value
                  except json.JSONDecodeError:
                      continue
              return None

          async def route_with_fallback(message, context):
              route = local_route(message, context)
              if route:
                  return route

              prompt = f"""{SYSTEM_REFERENCE}

          Return ONLY one valid JSON object. Do not use markdown fences. Do not add
          explanations before or after the JSON.

          Allowed actions: PLAN, UPDATE, COMPARE, BATCH_UPDATE, REUSE, ASK, MULTI_LEG.
          Current context:
          {json.dumps((context or {}).get('request', {}), ensure_ascii=False)}

          User message:
          {message}

          Rules:
          - 'do the same for A, B and C' => BATCH_UPDATE with exactly A, B, C.
          - Preserve earlier origin/dates/travelers/budget on follow-ups.
          - Never invent dates.
          - Always use uppercase 3-letter IATA codes in airport fields when known.
          - For an unknown airport, set destinationAirport to null; resolve it separately
            before flight search. Never invent an IATA code.
          - For multi-hop requests like "Chennai → Madurai → Coimbatore", return
            MULTI_LEG with a legs list. Each leg has origin, destination, departDate,
            returnDate, passengers, budgetLevel.
          - Ensure dates are consecutive between legs.

          Return exactly this JSON shape:
          {{"action":"ASK","origin":null,"destinationCity":null,"destinationAirport":null,"destinations":[],"departDate":null,"returnDate":null,"passengers":null,"budgetLevel":null,"legs":[]}}"""

              async def ask_router(extra_instruction=""):
                  router_prompt = prompt
                  if extra_instruction:
                      router_prompt += f"\n\n{extra_instruction}"
                  result = await model().ainvoke([HumanMessage(content=router_prompt)])
                  return parse_json_object(result.content or "")

              route = await ask_router()
              if route:
                  return route

              # Retry once with a tiny, explicit schema. This protects against
              # truncated JSON / markdown even when the first model response is bad.
              route = await ask_router(
                  'RETRY: Your previous response was not valid JSON. Return ONLY a '
                  'single compact JSON object. No markdown, no commentary, no code fence.'
              )
              if route:
                  return route

              raise ValueError("Fast router returned invalid JSON after retry")
'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-router-json.yml
          git add frontend/streamlit_app.py .github/workflows/fix-router-json.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix fast router JSON parsing"
          git push origin main
