name: Harden fast router JSON

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch streamlit router
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('frontend/streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'return ChatGroq(model="openai/gpt-oss-20b", temperature=0, max_tokens=180)',
              'return ChatGroq(model="openai/gpt-oss-20b", temperature=0, max_tokens=500)'
          )

          start = text.index('async def route_with_fallback(message, context):')
          end = text.index('\ndef normalize(req, base=None):', start)

          replacement = r'''def extract_json_object(text):
    """Safely extract one JSON object from an LLM response."""
    if not text:
        return None

    text = str(text).strip()

    try:
        value = json.loads(text)
        return value if isinstance(value, dict) else None
    except json.JSONDecodeError:
        pass

    for block in re.findall(r"```(?:json)?\s*(.*?)\s*```", text, re.I | re.S):
        try:
            value = json.loads(block.strip())
            if isinstance(value, dict):
                return value
        except json.JSONDecodeError:
            continue

    decoder = json.JSONDecoder()
    for i, ch in enumerate(text):
        if ch != '{':
            continue
        try:
            value, _ = decoder.raw_decode(text[i:])
            if isinstance(value, dict):
                return value
        except json.JSONDecodeError:
            continue

    return None


async def route_with_fallback(message, context):
    route = local_route(message, context)
    if route:
        return route

    prompt = f"""{SYSTEM_REFERENCE}

You are a strict JSON router. Return exactly ONE JSON object and absolutely no
Markdown, prose, code fences, or commentary.

Allowed actions: PLAN, UPDATE, COMPARE, BATCH_UPDATE, REUSE, ASK, MULTI_LEG.

Current context:
{json.dumps((context or {}).get('request', {}), ensure_ascii=False)}

User message:
{message}

Rules:
- Preserve earlier origin, dates, travelers and budget on follow-ups.
- Never invent dates.
- Airport fields must be uppercase 3-letter IATA codes when known.
- 'do the same for A, B and C' => BATCH_UPDATE with exactly A, B, C.
- A multi-hop request => MULTI_LEG with a legs list.
- Each MULTI_LEG item must contain origin, destination, departDate,
  returnDate, passengers and budgetLevel.

Return this exact schema shape:
{{"action":"ASK","origin":null,"destinationCity":null,"destinationAirport":null,"destinations":[],"departDate":null,"returnDate":null,"passengers":null,"budgetLevel":null,"legs":[]}}
"""

    llm = model()
    allowed = {'PLAN', 'UPDATE', 'COMPARE', 'BATCH_UPDATE', 'REUSE', 'ASK', 'MULTI_LEG'}
    last_error = None

    for attempt in range(2):
        try:
            result = await llm.ainvoke([HumanMessage(content=prompt)])
            route = extract_json_object(result.content)
            if isinstance(route, dict) and str(route.get('action', '')).upper() in allowed:
                route['action'] = str(route['action']).upper()
                return route
            last_error = ValueError('Router returned JSON with an invalid action.')
        except Exception as exc:
            last_error = exc

        prompt += "\nIMPORTANT RETRY: Output ONLY one compact valid JSON object. No markdown, prose, or code fence."

    raise ValueError(f'Fast router returned invalid JSON after 2 attempts: {last_error}')
'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile frontend/streamlit_app.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden fast router JSON parsing"
          git push origin main
