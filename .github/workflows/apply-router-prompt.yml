name: Apply semantic router prompt

on:
  push:
    paths:
      - '.github/workflows/apply-router-prompt.yml'

permissions:
  contents: write

jobs:
  apply-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date

          app = Path('frontend/streamlit_app.py')
          prompt_file = Path('tools/system_prompt_router.txt')
          text = app.read_text(encoding='utf-8')
          prompt = prompt_file.read_text(encoding='utf-8').replace('{today}', date.today().isoformat())

          start = text.index('def build_router_prompt(context, chat_history):')
          end = text.index('\n\nasync def route_request', start)

          function = '''def build_router_prompt(context, chat_history):\n    return f"""''' + prompt.replace('"""', '\\"\\"\\"') + '''\n\nACTIVE TRIP CONTEXT:\n{active_trip_summary(context)}\n\nRECENT CONVERSATION:\n{format_conversation(chat_history)}\n"""\n'''

          app.write_text(text[:start] + function + text[end:], encoding='utf-8')

          # Remove client-side airport placeholder from requests. The MCP server resolves it.
          text = app.read_text(encoding='utf-8')
          text = text.replace('            "destinationAirport": city,\n', '')
          app.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/streamlit_app.py
          git diff --cached --quiet || git commit -m "Fix semantic router schema and MCP city payload"
          git push
